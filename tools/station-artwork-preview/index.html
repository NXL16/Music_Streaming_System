<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Station Artwork Preview</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #161616;
        color: #f5f5f7;
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-width: 320px;
      }
      main {
        display: grid;
        gap: 32px;
        grid-template-columns: minmax(280px, 390px) minmax(300px, 1fr);
        max-width: 1100px;
        min-height: 100vh;
        margin: 0 auto;
        padding: 48px 24px;
      }
      h1 {
        font-size: 28px;
        margin: 0 0 8px;
      }
      p {
        color: #a1a1a6;
        line-height: 1.45;
        margin: 0;
      }
      .panel {
        align-self: start;
        border: 1px solid #3a3a3c;
        border-radius: 16px;
        padding: 20px;
        background: #212122;
      }
      .fields {
        display: grid;
        gap: 18px;
        margin-top: 24px;
      }
      label {
        display: grid;
        gap: 8px;
        color: #d1d1d6;
        font-size: 13px;
        font-weight: 600;
      }
      input {
        width: 100%;
        color: #f5f5f7;
        background: #2c2c2e;
        border: 1px solid #48484a;
        border-radius: 8px;
        font: inherit;
        padding: 10px 12px;
      }
      input[type="file"] {
        cursor: pointer;
      }
      input[type="color"] {
        height: 42px;
        padding: 4px;
      }
      .color-row {
        display: grid;
        gap: 8px;
        grid-template-columns: 48px 1fr auto;
      }
      button {
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        font: inherit;
        font-weight: 650;
        padding: 10px 12px;
      }
      button.secondary {
        background: #3a3a3c;
        color: #fff;
      }
      button.primary {
        background: #ff375f;
        color: #fff;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
      .hint {
        font-size: 12px;
        color: #8e8e93;
      }
      .preview-area {
        display: grid;
        place-items: center;
        min-height: 520px;
        border-radius: 20px;
        background: radial-gradient(circle at center, #2c2c2e, #191919 72%);
      }
      .station-card {
        width: min(440px, 78vw);
        aspect-ratio: 1;
        overflow: hidden;
        border-radius: 10px;
        box-shadow: 0 16px 40px rgb(0 0 0 / 0.35);
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .station-title {
        width: min(440px, 78vw);
        margin-top: 12px;
        font-size: 15px;
        font-weight: 700;
      }
      .station-subtitle {
        width: min(440px, 78vw);
        margin-top: 4px;
        color: #a1a1a6;
        font-size: 13px;
      }
      @media (max-width: 760px) {
        main {
          grid-template-columns: 1fr;
          padding: 28px 16px;
        }
        .preview-area {
          min-height: 360px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <h1>Station Artwork Preview</h1>
        <p>
          Upload a song cover. The tool selects its dominant vibrant color and
          builds a Station artwork with the cover centered.
        </p>

        <div class="fields">
          <label>
            Song artwork
            <input
              id="artwork-file"
              type="file"
              accept="image/png,image/jpeg,image/webp"
            />
          </label>

          <label>
            Station name
            <input
              id="station-name"
              type="text"
              value="Song Station"
              maxlength="80"
            />
          </label>

          <label>
            Base color
            <span class="color-row">
              <input
                id="color-picker"
                type="color"
                value="#cb2737"
                aria-label="Station base color"
              />
              <input
                id="color-value"
                type="text"
                value="#CB2737"
                maxlength="7"
                aria-label="Station base color hex value"
              />
              <button id="auto-color" class="secondary" type="button" disabled>
                Auto
              </button>
            </span>
          </label>

          <button id="download" class="primary" type="button" disabled>
            Download PNG
          </button>
          <p class="hint">
            Preview uses a 1080 × 1080 output. Nothing is uploaded or saved by
            this tool.
          </p>
        </div>
      </section>

      <section class="preview-area" aria-label="Station artwork preview">
        <div>
          <div class="station-card">
            <canvas id="station-canvas" width="1080" height="1080"></canvas>
          </div>
          <div id="preview-title" class="station-title">Song Station</div>
          <div class="station-subtitle">Radio Station</div>
        </div>
      </section>
    </main>

    <script>
      const outputSize = 1080;
      const canvas = document.querySelector("#station-canvas");
      const context = canvas.getContext("2d");
      const fileInput = document.querySelector("#artwork-file");
      const colorPicker = document.querySelector("#color-picker");
      const colorValue = document.querySelector("#color-value");
      const stationName = document.querySelector("#station-name");
      const previewTitle = document.querySelector("#preview-title");
      const autoColor = document.querySelector("#auto-color");
      const download = document.querySelector("#download");
      let artworkImage = null;
      let detectedColor = "#CB2737";

      function normalizeHex(value) {
        const normalized = value.trim().replace(/^#/, "");
        return /^[0-9a-f]{6}$/i.test(normalized)
          ? `#${normalized.toUpperCase()}`
          : null;
      }

      function darken(color, amount) {
        const hex = color.slice(1);
        const channel = (offset) =>
          Math.round(
            Number.parseInt(hex.slice(offset, offset + 2), 16) * (1 - amount),
          );
        return `rgb(${channel(0)}, ${channel(2)}, ${channel(4)})`;
      }

      function vividHue(color) {
        const hex = color.slice(1);
        const red = Number.parseInt(hex.slice(0, 2), 16) / 255;
        const green = Number.parseInt(hex.slice(2, 4), 16) / 255;
        const blue = Number.parseInt(hex.slice(4, 6), 16) / 255;
        const maximum = Math.max(red, green, blue);
        const minimum = Math.min(red, green, blue);
        const chroma = maximum - minimum;

        if (chroma === 0) return "#808080";

        let hue;
        if (maximum === red) hue = ((green - blue) / chroma) % 6;
        else if (maximum === green) hue = (blue - red) / chroma + 2;
        else hue = (red - green) / chroma + 4;

        hue = ((hue * 60) + 360) % 360;
        const segment = hue / 60;
        const secondary = 1 - Math.abs((segment % 2) - 1);
        const brightness = 0.86;
        const saturation = 0.81;
        const channels = [
          segment < 1 ? 1 : segment < 2 ? secondary : segment < 4 ? 0 : segment < 5 ? secondary : 1,
          segment < 1 ? secondary : segment < 3 ? 1 : segment < 4 ? secondary : 0,
          segment < 2 ? 0 : segment < 3 ? secondary : segment < 5 ? 1 : secondary,
        ];

        return `#${channels
          .map((channel) => Math.round(brightness * ((1 - saturation) + channel * saturation) * 255).toString(16).padStart(2, "0"))
          .join("")
          .toUpperCase()}`;
      }

      function drawRoundedImage(image, x, y, size, radius) {
        context.save();
        context.beginPath();
        context.roundRect(x, y, size, size, radius);
        context.clip();
        const scale = Math.max(size / image.width, size / image.height);
        const width = image.width * scale;
        const height = image.height * scale;
        context.drawImage(
          image,
          x + (size - width) / 2,
          y + (size - height) / 2,
          width,
          height,
        );
        context.restore();
      }

      function render() {
        const color = normalizeHex(colorValue.value) || detectedColor;
        context.clearRect(0, 0, outputSize, outputSize);
        const background = context.createLinearGradient(0, 0, 0, outputSize);
        background.addColorStop(0, darken(color, 0.52));
        background.addColorStop(0.48, darken(color, 0.2));
        background.addColorStop(1, color);
        context.fillStyle = background;
        context.fillRect(0, 0, outputSize, outputSize);

        context.save();
        context.fillStyle = "rgba(255, 255, 255, 0.86)";
        context.font = "700 58px Inter, ui-sans-serif, system-ui, sans-serif";
        context.textAlign = "right";
        context.textBaseline = "top";
        context.fillText("404Hz", outputSize - 52, 48);
        context.restore();

        if (!artworkImage) return;
        const coverSize = 800;
        const coverX = (outputSize - coverSize) / 2;
        const coverY = (outputSize - coverSize) / 2;
        context.save();
        context.shadowColor = "rgba(0, 0, 0, 0.28)";
        context.shadowBlur = 34;
        context.shadowOffsetY = 18;
        drawRoundedImage(artworkImage, coverX, coverY, coverSize, 26);
        context.restore();
      }

      function detectVibrantColor(image) {
        const sampleSize = 72;
        const sample = document.createElement("canvas");
        sample.width = sampleSize;
        sample.height = sampleSize;
        const sampleContext = sample.getContext("2d", {
          willReadFrequently: true,
        });
        sampleContext.drawImage(image, 0, 0, sampleSize, sampleSize);
        const pixels = sampleContext.getImageData(
          0,
          0,
          sampleSize,
          sampleSize,
        ).data;
        const buckets = new Map();

        for (let index = 0; index < pixels.length; index += 16) {
          const alpha = pixels[index + 3];
          if (alpha < 220) continue;
          const red = pixels[index];
          const green = pixels[index + 1];
          const blue = pixels[index + 2];
          const max = Math.max(red, green, blue);
          const min = Math.min(red, green, blue);
          const saturation = max === 0 ? 0 : (max - min) / max;
          const lightness = (max + min) / 510;
          if (lightness < 0.22 || lightness > 0.9) continue;
          const step = 24;
          const bucket = [red, green, blue].map((value) =>
            Math.min(255, Math.floor(value / step) * step + step / 2),
          );
          const key = bucket.join(",");
          const weight = 1 + saturation * 5;
          buckets.set(key, (buckets.get(key) || 0) + weight);
        }

        const winner = [...buckets.entries()].sort(
          (left, right) => right[1] - left[1],
        )[0];
        if (!winner) return "#808080";
        const [red, green, blue] = winner[0].split(",").map(Number);
        return `#${[red, green, blue]
          .map((value) => value.toString(16).padStart(2, "0"))
          .join("")
          .toUpperCase()}`;
      }

      fileInput.addEventListener("change", () => {
        const [file] = fileInput.files || [];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const image = new Image();
          image.onload = () => {
            artworkImage = image;
            detectedColor = vividHue(detectVibrantColor(image));
            colorPicker.value = detectedColor;
            colorValue.value = detectedColor;
            autoColor.disabled = false;
            download.disabled = false;
            render();
          };
          image.src = String(reader.result);
        };
        reader.readAsDataURL(file);
      });

      colorPicker.addEventListener("input", () => {
        colorValue.value = colorPicker.value.toUpperCase();
        render();
      });
      colorValue.addEventListener("input", () => {
        const color = normalizeHex(colorValue.value);
        if (color) colorPicker.value = color;
        render();
      });
      autoColor.addEventListener("click", () => {
        colorPicker.value = detectedColor;
        colorValue.value = detectedColor;
        render();
      });
      stationName.addEventListener("input", () => {
        previewTitle.textContent = stationName.value.trim() || "Song Station";
      });
      download.addEventListener("click", () => {
        const link = document.createElement("a");
        link.download = `${
          (stationName.value.trim() || "station")
            .replace(/[^a-z0-9]+/gi, "-")
            .replace(/^-|-$/g, "")
            .toLowerCase() || "station"
        }-artwork.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
      });

      render();
    </script>
  </body>
</html>
