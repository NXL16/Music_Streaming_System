syntax = "proto3";

package recommendation_service;

import "google/protobuf/struct.proto";

option go_package = "Music_Streaming_System/packages/shared-proto/recommendation";

service RecommendationService {
  rpc GetHomeRecommendations(GetHomeRecommendationsRequest) returns (GetHomeRecommendationsResponse);
  rpc GetRecommendationSection(GetRecommendationSectionRequest) returns (GetHomeRecommendationsResponse);
  rpc GetAlbumRelatedRecommendations(GetAlbumRelatedRecommendationsRequest) returns (GetAlbumRelatedRecommendationsResponse);
  rpc RefreshRecommendationSection(RefreshRecommendationSectionRequest) returns (GetHomeRecommendationsResponse);
  rpc ReplaceHomeRecommendations(ReplaceHomeRecommendationsRequest) returns (GetHomeRecommendationsResponse);
  rpc PublishRecommendationPage(PublishRecommendationPageRequest) returns (GetHomeRecommendationsResponse);
  rpc GetRecommendationPageForAdmin(GetRecommendationPageForAdminRequest) returns (GetHomeRecommendationsResponse);
  rpc RecordListeningEvent(RecordListeningEventRequest) returns (RecordListeningEventResponse);
  rpc CleanupPlaylistHistory(CleanupPlaylistHistoryRequest) returns (CleanupPlaylistHistoryResponse);
  rpc GenerateRecommendations(GenerateRecommendationsRequest) returns (GetHomeRecommendationsResponse);
  rpc GetListeningAnalytics(GetListeningAnalyticsRequest) returns (ListeningAnalyticsResponse);
  rpc GetRecommendationQualityAnalytics(GetRecommendationQualityAnalyticsRequest) returns (RecommendationQualityAnalyticsResponse);
  rpc RecordRecommendationInteraction(RecordRecommendationInteractionRequest) returns (RecordRecommendationInteractionResponse);
  rpc RecordPreferenceEvent(RecordPreferenceEventRequest) returns (RecordPreferenceEventResponse);
  rpc ListContentPreferences(ListContentPreferencesRequest) returns (ListContentPreferencesResponse);
  rpc SetArtistFollow(SetArtistFollowRequest) returns (ArtistFollowResponse);
  rpc GetArtistFollow(GetArtistFollowRequest) returns (ArtistFollowResponse);
  rpc UpsertSystemStationArtwork(UpsertSystemStationArtworkRequest) returns (SystemStationArtworkResponse);
  rpc UpsertSystemPlaylistArtwork(UpsertSystemPlaylistArtworkRequest) returns (SystemPlaylistArtworkResponse);
  rpc SetSystemPlaylistArtworkColor(SetSystemPlaylistArtworkColorRequest) returns (SystemPlaylistArtworkResponse);
  rpc CreateSongStation(CreateSongStationRequest) returns (SongStationResponse);
  rpc GetSongStation(GetSongStationRequest) returns (SongStationResponse);
  rpc GetSongStationTracks(GetSongStationTracksRequest) returns (SongStationTracksResponse);
  rpc CreateArtistStation(CreateArtistStationRequest) returns (ArtistStationResponse);
  rpc GetArtistStation(GetArtistStationRequest) returns (ArtistStationResponse);
  rpc GetArtistStationTracks(GetArtistStationTracksRequest) returns (SongStationTracksResponse);
  rpc GetSystemPlaylistTracks(GetSystemPlaylistTracksRequest) returns (SystemPlaylistTracksResponse);
}

message CleanupPlaylistHistoryRequest {
  string user_id     = 1;
  string playlist_id = 2;
}

message CleanupPlaylistHistoryResponse { bool success = 1; }

message UpsertSystemStationArtworkRequest {
  string station_key   = 1;
  string cover_asset_id = 2;
  string actor_user_id = 3;
  string hero_video_asset_id = 4;
}

message SystemStationArtworkResponse {
  string station_key = 1;
  string cover_asset_id = 2;
  string hero_video_asset_id = 3;
}

message UpsertSystemPlaylistArtworkRequest {
  string playlist_key = 1;
  string cover_asset_id = 2;
  string home_card_asset_id = 3;
  string actor_user_id = 4;
  string detail_square_video_asset_id = 5;
  string detail_mobile_video_asset_id = 6;
  string home_hero_video_asset_id = 7;
}
message SystemPlaylistArtworkResponse {
  string playlist_key = 1;
  string cover_asset_id = 2;
  string home_card_asset_id = 3;
  string detail_square_video_asset_id = 4;
  string detail_mobile_video_asset_id = 5;
  string home_hero_video_asset_id = 6;
}
message SetSystemPlaylistArtworkColorRequest { string playlist_key = 1; string bg_color = 2; string actor_user_id = 3; }


message CreateSongStationRequest {
  string user_id = 1;
  string song_id = 2;
  // Set only by the API after it has rendered and persisted the Station PNG.
  string station_artwork_asset_id = 3;
  string station_artwork_bg_color = 4;
  // The release context that supplies Station artwork for a reusable Song.
  string source_album_id = 5;
}

message SongStationResponse {
  string station_id = 1;
  string name = 2;
  string description = 3;
  string artwork_url = 4;
  string artwork_bg_color = 5;
  repeated string track_ids = 6;
  // Internal API rendering input; never needs to be displayed by the client.
  string seed_artwork_url = 7;
  string seed_song_id = 8;
  bool artwork_ready = 9;
  string seed_album_id = 10;
}

message GetSongStationRequest {
  string user_id = 1;
  string station_id = 2;
}

// Requests the next distinct batch for a running Song Station. The caller
// supplies its current session queue so the service never sends a repeat.
message GetSongStationTracksRequest {
  string user_id = 1;
  string station_id = 2;
  repeated string excluded_song_ids = 3;
  int32 limit = 4;
}

message SongStationTracksResponse {
  repeated string track_ids = 1;
}

message CreateArtistStationRequest {
  string user_id = 1;
  string artist_id = 2;
  string station_artwork_asset_id = 3;
  string station_artwork_bg_color = 4;
  bool artist_only = 5;
}

message ArtistStationResponse {
  string station_id = 1;
  string name = 2;
  string description = 3;
  string artwork_url = 4;
  string artwork_bg_color = 5;
  repeated string track_ids = 6;
  repeated string featured_artist_artwork_urls = 7;
  repeated string featured_artist_ids = 8;
  bool artwork_ready = 9;
  string seed_artist_id = 10;
  bool artist_only = 11;
}

message GetArtistStationRequest {
  string user_id = 1;
  string station_id = 2;
}

message GetArtistStationTracksRequest {
  string user_id = 1;
  string station_id = 2;
  repeated string excluded_song_ids = 3;
  int32 limit = 4;
}

// Resolves the signed-in listener's cached contents of one of the three fixed
// catalog playlists. It never creates a user playlist.
message GetSystemPlaylistTracksRequest {
  string user_id = 1;
  string playlist_id = 2;
}

message SystemPlaylistTracksResponse {
  repeated string track_ids = 1;
}

enum RecommendationPageScope {
  RECOMMENDATION_PAGE_SCOPE_UNSPECIFIED = 0;
  RECOMMENDATION_PAGE_SCOPE_GLOBAL      = 1;
  RECOMMENDATION_PAGE_SCOPE_USER        = 2;
}

enum RecommendationPageStatus {
  RECOMMENDATION_PAGE_STATUS_UNSPECIFIED = 0;
  RECOMMENDATION_PAGE_STATUS_DRAFT       = 1;
  RECOMMENDATION_PAGE_STATUS_PUBLISHED   = 2;
  RECOMMENDATION_PAGE_STATUS_ARCHIVED    = 3;
}

enum RecommendationPresentationMode {
  RECOMMENDATION_PRESENTATION_MODE_UNSPECIFIED = 0;
  RECOMMENDATION_PRESENTATION_MODE_AUTO        = 1;
  RECOMMENDATION_PRESENTATION_MODE_FIXED       = 2;
}

message GetHomeRecommendationsRequest {
  string user_id  = 1;
  string name     = 2;
  string locale   = 3;
  string timezone = 4;
  string platform = 5;
}

message GetRecommendationSectionRequest {
  string user_id    = 1;
  string section_id = 2;
  string name       = 3;
  string locale     = 4;
  string timezone   = 5;
}

message GetAlbumRelatedRecommendationsRequest {
  string user_id  = 1;
  string album_id = 2;
  int32  limit    = 3;
}

message GetAlbumRelatedRecommendationsResponse {
  repeated string album_ids = 1;
}

message RefreshRecommendationSectionRequest {
  string user_id    = 1;
  string section_id = 2;
  string name       = 3;
  string locale     = 4;
  string timezone   = 5;
}

message ReplaceHomeRecommendationsRequest {
  string                                  user_id       = 1;
  string                                  name          = 2;
  string                                  locale        = 3;
  string                                  timezone      = 4;
  string                                  platform      = 5;
  repeated PersonalRecommendationResource sections      = 6;
  repeated CatalogResource                resources     = 7;
  RecommendationPageScope                 scope         = 8;
  RecommendationPageStatus                status        = 9;
  string                                  actor_user_id = 10;
}

message PublishRecommendationPageRequest {
  string                  user_id       = 1;
  string                  name          = 2;
  string                  locale        = 3;
  string                  timezone      = 4;
  string                  platform      = 5;
  RecommendationPageScope scope         = 6;
  string                  actor_user_id = 7;
}

message RecommendationRef {
  string id   = 1;
  string type = 2;
  string href = 3;
}

message GetRecommendationPageForAdminRequest {
  string                   user_id       = 1;
  string                   name          = 2;
  string                   locale        = 3;
  string                   timezone      = 4;
  string                   platform      = 5;
  RecommendationPageScope  scope         = 6;
  RecommendationPageStatus status        = 7;
  string                   actor_user_id = 8;
}

message RecommendationRelationship {
  string                     href = 1;
  repeated RecommendationRef data = 2;
}

message RecommendationRelationships {
  RecommendationRelationship contents        = 1;
  RecommendationRelationship primary_content = 2;
}

message RecommendationDisplay {
  string          kind        = 1;
  repeated string decorations = 2;
}

message DisplayTitle {
  string string_for_display = 1;
}

message PersonalRecommendationAttributes {
  RecommendationDisplay          display                       = 1;
  bool                           has_see_all                   = 2;
  bool                           is_group_recommendation       = 3;
  string                         kind                          = 4;
  string                         next_update_date              = 5;
  repeated string                resource_types                = 6;
  DisplayTitle                   title                         = 7;
  DisplayTitle                   title_without_name            = 8;
  int32                          version                       = 9;
  RecommendationPresentationMode presentation_mode             = 10;
  string                         source_album_id               = 11;
  string                         source_album_name             = 12;
  string                         source_album_url              = 13;
  string                         source_album_artwork_url      = 14;
  string                         source_album_artwork_bg_color = 15;
  string                         listen_again_album_id        = 16;
}

message PersonalRecommendationResource {
  string                           id            = 1;
  string                           type          = 2;
  string                           href          = 3;
  PersonalRecommendationAttributes attributes    = 4;
  RecommendationRelationships      relationships = 5;
}

message CatalogResource {
  string                 id            = 1;
  string                 type          = 2;
  string                 href          = 3;
  google.protobuf.Struct attributes    = 4;
  google.protobuf.Struct relationships = 5;
}

message RecommendationResources {
  map<string, PersonalRecommendationResource> personal_recommendation = 1;
  map<string, CatalogResource>                albums                  = 2;
  map<string, CatalogResource>                playlists               = 3;
  map<string, CatalogResource>                stations                = 4;
  map<string, CatalogResource>                editorial_items         = 5;
  map<string, CatalogResource>                artists                 = 6;
  map<string, CatalogResource>                songs                   = 7;
}

message RecommendationMeta {
  string name     = 1;
  string locale   = 2;
  string timezone = 3;
  string platform = 4;
}

message GetHomeRecommendationsResponse {
  repeated RecommendationRef data      = 1;
  RecommendationResources    resources = 2;
  RecommendationMeta         meta      = 3;
}

enum ListeningEventType {
  LISTENING_EVENT_TYPE_UNSPECIFIED   = 0;
  LISTENING_EVENT_TYPE_PLAY_START    = 1;
  LISTENING_EVENT_TYPE_PLAY_COMPLETE = 2;
  LISTENING_EVENT_TYPE_SKIP          = 3;
  LISTENING_EVENT_TYPE_PLAY_STOPPED  = 4;
}

enum RecommendationInteractionType {
  RECOMMENDATION_INTERACTION_TYPE_UNSPECIFIED = 0;
  RECOMMENDATION_INTERACTION_TYPE_IMPRESSION  = 1;
  RECOMMENDATION_INTERACTION_TYPE_OPEN        = 2;
  RECOMMENDATION_INTERACTION_TYPE_PLAY        = 3;
  RECOMMENDATION_INTERACTION_TYPE_DISMISS     = 4;
}

message RecordRecommendationInteractionRequest {
  string                        user_id       = 1;
  string                        section_id    = 2;
  string                        resource_type = 3;
  string                        resource_id   = 4;
  int32                         position      = 5;
  int32                         model_version = 6;
  RecommendationInteractionType event_type    = 7;
}

message RecordRecommendationInteractionResponse {
  bool success = 1;
}

message RecordListeningEventRequest {
  string             user_id                   = 1;
  string             song_id                   = 2;
  ListeningEventType event_type                = 3;
  int32              duration_sec              = 4;
  int32              total_sec                 = 5;
  string             song_title                = 6;
  string             artist_name               = 7;
  string             album_name                = 8;
  string             album_id                  = 9;
  string             playlist_id               = 10;
  string             playlist_name             = 11;
  string             playlist_artwork_url      = 12;
  string             playlist_artwork_bg_color = 13;
  string             station_id                = 14;
  string             station_name              = 15;
  string             station_artwork_url       = 16;
  string             station_artwork_bg_color  = 17;
  string             playlist_curator_name     = 18;
  // Optional client-generated ID. A retry must reuse the same value.
  string event_id = 19;
}

enum PreferenceEventType {
  PREFERENCE_EVENT_TYPE_UNSPECIFIED            = 0;
  PREFERENCE_EVENT_TYPE_LIBRARY_ADDED          = 1;
  PREFERENCE_EVENT_TYPE_LIBRARY_REMOVED        = 2;
  PREFERENCE_EVENT_TYPE_ALBUM_FAVOURITED       = 3;
  PREFERENCE_EVENT_TYPE_ALBUM_UNFAVOURITED     = 4;
  PREFERENCE_EVENT_TYPE_SONG_FAVOURITED        = 5;
  PREFERENCE_EVENT_TYPE_SONG_UNFAVOURITED      = 6;
  PREFERENCE_EVENT_TYPE_PLAYLIST_TRACK_ADDED   = 7;
  PREFERENCE_EVENT_TYPE_PLAYLIST_TRACK_REMOVED = 8;
  PREFERENCE_EVENT_TYPE_ARTIST_FOLLOWED        = 9;
  PREFERENCE_EVENT_TYPE_ARTIST_UNFOLLOWED      = 10;
  PREFERENCE_EVENT_TYPE_SEARCH_CLICKED         = 11;
  PREFERENCE_EVENT_TYPE_CONTENT_HIDDEN         = 12;
  // A deliberate queue choice is a positive but weaker signal than Favourite.
  PREFERENCE_EVENT_TYPE_QUEUE_ADDED           = 13;
  PREFERENCE_EVENT_TYPE_PLAYLIST_FAVOURITED   = 14;
  PREFERENCE_EVENT_TYPE_PLAYLIST_UNFAVOURITED = 15;
}

message RecordPreferenceEventRequest {
  string              user_id       = 1;
  string              event_id      = 2;
  PreferenceEventType event_type    = 3;
  string              resource_type = 4;
  string              resource_id   = 5;
  double              weight        = 6;
}

message RecordPreferenceEventResponse { bool success = 1; }

message ListContentPreferencesRequest { string user_id = 1; }

message ContentPreference {
  string resource_type = 1;
  string resource_id   = 2;
}

message ListContentPreferencesResponse {
  repeated ContentPreference hidden_resources = 1;
}

message SetArtistFollowRequest { string user_id = 1; string artist_id = 2; bool is_followed = 3; }

message GetArtistFollowRequest { string user_id = 1; string artist_id = 2; }

message ArtistFollowResponse { bool success = 1; bool is_followed = 2; bool changed = 3; }

message RecordListeningEventResponse {
  bool success = 1;
}

message GenerateRecommendationsRequest {
  string                  user_id       = 1;
  RecommendationPageScope scope         = 2;
  string                  actor_user_id = 3;
  string                  name          = 4;
  string                  locale        = 5;
  string                  timezone      = 6;
  string                  platform      = 7;
}

message GetListeningAnalyticsRequest {
  repeated string song_ids = 1;
  int32           days     = 2;
}

message ListeningAnalyticsTrendPoint {
  string date        = 1;
  int64  plays       = 2;
  int64  completions = 3;
  int64  skips       = 4;
  int64  listeners   = 5;
}

message ListeningAnalyticsTopSong {
  string song_id     = 1;
  string title       = 2;
  string artist_name = 3;
  int64  plays       = 4;
  int64  completions = 5;
  int64  skips       = 6;
  int64  listeners   = 7;
}

message ListeningAnalyticsResponse {
  int64                                 plays       = 1;
  int64                                 completions = 2;
  int64                                 skips       = 3;
  int64                                 listeners   = 4;
  repeated ListeningAnalyticsTrendPoint trend       = 5;
  repeated ListeningAnalyticsTopSong    top_songs   = 6;
}

// Quality funnel for recommendation cards that were actually served. Completion
// is intentionally excluded: listening events currently do not carry a
// recommendation attribution token and must not be guessed from timing alone.
message GetRecommendationQualityAnalyticsRequest {
  int32 days  = 1;
  int32 limit = 2;
}

message RecommendationQualityMetric {
  string section_id    = 1;
  int32  model_version = 2;
  int64  impressions   = 3;
  int64  opens         = 4;
  int64  plays         = 5;
  int64  dismisses     = 6;
  int64  users         = 7;
  double open_rate     = 8;
  double play_rate     = 9;
  double dismiss_rate  = 10;
}

message RecommendationQualityAnalyticsResponse {
  RecommendationQualityMetric          summary              = 1;
  repeated RecommendationQualityMetric sections             = 2;
  int32                                active_model_version = 3;
  string                               window_start_at      = 4;
  bool                                 baseline_applied     = 5;
}
